# Forge self-hosted stack: app + Postgres, with persistent storage for the
# bare git repos. Set FORGE_SECRET (and optionally FORGE_EXTERNAL_URL)
# before `docker compose up -d`.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://forge:forge@db:5432/forge
      FORGE_SECRET: ${FORGE_SECRET:?set FORGE_SECRET before starting (2FA encryption key)}
      FORGE_EXTERNAL_URL: ${FORGE_EXTERNAL_URL:-http://localhost:3000}
      FORGE_HOOK_TOKEN: ${FORGE_HOOK_TOKEN:-}
      # Self-hosted default: allow webhooks to reach internal CI. Restrict
      # further with FORGE_WEBHOOK_EGRESS=allowlist + FORGE_WEBHOOK_PRIVATE_CIDRS.
      FORGE_WEBHOOK_EGRESS: ${FORGE_WEBHOOK_EGRESS:-private-allow}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3000:3000"
      - "2222:2222"
    volumes:
      - forge-data:/data

volumes:
  pgdata:
  forge-data:
